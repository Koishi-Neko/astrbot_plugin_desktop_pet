<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstrBotPet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bubble" class="hidden"><span id="bubble-text"></span></div>
  <div id="bubble-toggle" title="显示/隐藏对话"></div>
  <div id="input-toggle" title="显示/隐藏输入框">▲</div>

  <div id="pet" data-tauri-drag-region>
    <img id="avatar" src="assets/calm.png" draggable="false" data-tauri-drag-region />
    <canvas id="live2d-canvas"></canvas>
    <div id="resize-handle" title="拖动调整大小">↘</div>
  </div>

  <div id="input-bar" class="hidden">
    <button id="mic-btn" type="button" title="语音输入（点击开始/结束录音，识别后自动发送）">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <rect x="9" y="2" width="6" height="11" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0"></path>
        <line x1="12" y1="18" x2="12" y2="21"></line>
      </svg>
    </button>
    <canvas id="mic-waveform" width="60" height="24" class="hidden"></canvas>
    <input id="chat-input" type="text" placeholder="和我说点什么…" autocomplete="off" />
  </div>

  <div id="status-tip" class="hidden"></div>

  <div id="confirm-dialog" class="hidden">
    <div id="confirm-text"></div>
    <div class="settings-buttons">
      <button id="confirm-ok">确定</button>
      <button id="confirm-cancel">取消</button>
    </div>
  </div>

  <div id="menu" class="hidden">
    <div class="menu-item" id="menu-toggle-input">聊天</div>
    <div class="menu-item has-sub" id="menu-model">切换模型 ▸<div class="submenu" id="model-submenu"></div></div>
    <div class="menu-item" id="menu-passthrough">点击穿透 (Ctrl+Shift+P)</div>
    <div class="menu-item" id="menu-settings">设置</div>
    <div class="menu-item danger" id="menu-quit">退出</div>
  </div>

  <div id="settings" class="hidden">
    <div class="settings-title">连接设置</div>
    <label>运行模式</label>
    <select id="cfg-mode">
      <option value="astrbot">AstrBot 模式（推荐）</option>
      <option value="standalone">独立模式（无 AstrBot）</option>
    </select>
    <div id="cfg-astrbot-section">
      <label>AstrBot 地址</label>
      <input id="cfg-base-url" type="text" spellcheck="false" />
      <label>API Key</label>
      <input id="cfg-api-key" type="password" spellcheck="false" />
    </div>
    <div id="cfg-standalone-section" class="hidden">
      <label>模型地址（OpenAI 兼容，本地 Ollama 也行）</label>
      <input id="cfg-llm-base-url" type="text" spellcheck="false" placeholder="https://api.deepseek.com/v1" />
      <label>模型 API Key</label>
      <input id="cfg-llm-api-key" type="password" spellcheck="false" />
      <label>对话模型</label>
      <input id="cfg-llm-model" type="text" spellcheck="false" placeholder="deepseek-chat" />
      <label>桌面感知视觉模型（留空 = 用对话模型）</label>
      <input id="cfg-scene-model" type="text" spellcheck="false" placeholder="留空跟随对话模型" />
      <label>人格（留空 = 内置默认人格）</label>
      <textarea id="cfg-persona" rows="3" spellcheck="false" placeholder="你是桌宠…"></textarea>
      <label>TTS 地址（留空 = 无日语语音）</label>
      <input id="cfg-tts-url" type="text" spellcheck="false" placeholder="http://localhost:5000" />
    </div>
    <label class="settings-checkbox"><input id="cfg-voice" type="checkbox" /> 语音（日语配音）</label>
    <div class="settings-divider"></div>
    <label>语音识别提示词 (Hotwords)</label>
    <input id="cfg-asr-prompt" type="text" spellcheck="false" placeholder="可选，用于指定专有名词等" />
    <label>麦克风设备</label>
    <select id="cfg-mic-device"><option value="">默认设备</option></select>
    <div class="settings-divider"></div>
    <div class="settings-title">上传 Live2D 模型</div>
    <input id="cfg-model-path" type="text" spellcheck="false" placeholder="模型文件夹 / .model3.json / .zip 路径" />
    <div class="settings-note">也可以直接把模型文件夹或 zip 拖到桌宠身上；支持 Cubism 3~5（moc3）；rar 请手动解压后再传</div>
    <div class="settings-buttons">
      <button id="cfg-model-upload">上传并使用</button>
    </div>
    <div class="settings-note" id="cfg-section-note">主动对话与桌面感知（开关/间隔/模型/名单）在 AstrBot 插件控制页配置</div>
    <div class="settings-buttons">
      <button id="cfg-test">测试连接</button>
      <button id="cfg-save">保存</button>
      <button id="cfg-close">关闭</button>
    </div>
    <div id="cfg-message"></div>
  </div>

  <script src="vendor/live2dcubismcore.min.js"></script>
  <script src="vendor/pixi.min.js"></script>
  <script src="vendor/cubism4.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
