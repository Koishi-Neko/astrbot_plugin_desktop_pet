<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌宠控制页</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page">
      <h1>桌宠控制页</h1>

      <section class="card">
        <div class="card-title">
          状态
          <button id="btn-refresh" class="btn small">刷新</button>
        </div>
        <div id="status-box" class="kv">加载中…</div>
      </section>

      <section class="card">
        <div class="card-title">主人身份</div>
        <div class="warn">桌宠会话与 QQ 群聊中该账号的消息会被识别为同一位主人。</div>
        <label class="row">
          <span class="label">主人昵称</span>
          <input type="text" id="master-name" placeholder="留空则称呼为「主人」" />
        </label>
        <label class="row">
          <span class="label">主人 QQ 号</span>
          <input type="text" id="master-qq" placeholder="QQ 侧身份标注用，可留空" spellcheck="false" />
        </label>
        <div class="row buttons">
          <button id="btn-save-master" class="btn primary">保存身份</button>
          <span id="master-save-msg" class="msg"></span>
        </div>
      </section>

      <section class="card">
        <div class="card-title">QQ 日语配音</div>
        <div class="warn">开启后，bot 在全部 QQ 群聊/私聊的回复附带一条日语配音语音（文字仍为中文）。语音服务离线时自动降级为纯文字。</div>
        <label class="row checkbox-row">
          <input type="checkbox" id="qq-jp-dub" />
          <span>启用 QQ 会话日语配音</span>
        </label>
        <div class="row buttons">
          <button id="btn-save-dub" class="btn primary">保存开关</button>
          <span id="dub-save-msg" class="msg"></span>
        </div>
      </section>

      <section class="card">
        <div class="card-title">主动对话 / 桌面感知动态</div>
        <div id="pet-report" class="kv">加载中…</div>
      </section>

      <section class="card">
        <div class="card-title">主动对话 / 桌面感知配置</div>
        <div class="warn">壳端远程拉取（约 2 分钟内生效）。桌面感知开启后，桌宠按观察间隔抓取前台窗口截图发给视觉模型识图搭话，截图会发送给 LLM 提供商。</div>
        <label class="row checkbox-row">
          <input type="checkbox" id="proactive-enabled" />
          <span>启用主动对话（深夜催睡 / 回来问候 / 久坐提醒）</span>
        </label>
        <label class="row checkbox-row">
          <input type="checkbox" id="scene-enabled" />
          <span>启用桌面感知（看屏幕主动搭话）</span>
        </label>
        <label class="row">
          <span class="label">观察间隔</span>
          <select id="scene-interval">
            <option value="10">10 分钟</option>
            <option value="15">15 分钟</option>
            <option value="30">30 分钟</option>
            <option value="60">60 分钟</option>
          </select>
        </label>
        <label class="row">
          <span class="label">视觉模型</span>
          <input type="text" id="scene-provider" list="provider-list" placeholder="留空则跟随会话默认模型" spellcheck="false" />
          <datalist id="provider-list"></datalist>
        </label>
        <label class="row">
          <span class="label">禁止抓取进程</span>
          <textarea id="scene-blocklist" rows="3" spellcheck="false" placeholder="逗号分隔的小写进程名；名单内进程在前台时不截图"></textarea>
        </label>
        <div class="row buttons">
          <button id="btn-save-scene" class="btn primary">保存配置</button>
          <span id="scene-save-msg" class="msg"></span>
        </div>
      </section>

      <section class="card">
        <div class="card-title">TTS 语音配置</div>
        <label class="row checkbox-row">
          <input type="checkbox" id="tts-enabled" />
          <span>启用语音合成（桌宠回复附带日语配音）</span>
        </label>
        <label class="row">
          <span class="label">SBV2 服务地址</span>
          <input type="text" id="tts-base-url" placeholder="http://172.18.0.1:5000" spellcheck="false" />
        </label>
        <label class="row">
          <span class="label">模型</span>
          <select id="tts-model"></select>
        </label>
        <label class="row">
          <span class="label">说话人</span>
          <select id="tts-speaker"></select>
        </label>
        <label class="row">
          <span class="label">风格</span>
          <select id="tts-style"></select>
        </label>
        <label class="row">
          <span class="label">语速（length，越大越慢）</span>
          <input type="range" id="tts-length" min="0.5" max="2" step="0.05" />
          <span id="tts-length-val" class="mono">1.00</span>
        </label>
        <div id="models-error" class="warn"></div>
        <div class="row buttons">
          <button id="btn-save" class="btn primary">保存配置</button>
          <span id="save-msg" class="msg"></span>
        </div>
      </section>

      <section class="card">
        <div class="card-title">试听（用当前选中的参数合成，不保存）</div>
        <label class="row">
          <span class="label">日语文本</span>
          <input type="text" id="test-text" value="こんにちは！今日も一緒に頑張りましょう！" />
        </label>
        <div class="row buttons">
          <button id="btn-test" class="btn">合成并播放</button>
          <span id="test-msg" class="msg"></span>
        </div>
        <audio id="test-audio" controls class="hidden"></audio>
      </section>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
